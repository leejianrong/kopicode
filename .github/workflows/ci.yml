name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmtcheck
      - run: make vet
      - run: make tidycheck
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  test-all:
    name: Full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # e2e fixtures shell out to git, so it needs an identity to commit with.
      - name: Configure git for fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name  CI
          git config --global init.defaultBranch main
      - run: make test-all

  xbuild:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # make VERSION uses git describe
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make xbuild

  # bench-smoke is deliberately NOT wired up yet. `make bench-smoke` exists and is
  # documented, but the runner and corpus are slice-1 build steps 15-17, so the job
  # would be red from day one — and a CI check that is always red trains everyone to
  # ignore CI. Add this job in the PR that lands the corpus:
  #
  #   bench-smoke:
  #     name: Bench smoke (mock provider, zero tokens)
  #     runs-on: ubuntu-latest
  #     steps:
  #       - uses: actions/checkout@v5
  #       - uses: actions/setup-go@v6
  #         with: { go-version-file: go.mod, cache: true }
  #       - name: Configure git for worktrees
  #         run: |
  #           git config --global user.email ci@example.com
  #           git config --global user.name  CI
  #           git config --global init.defaultBranch main
  #       - run: make bench-smoke

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tree
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
