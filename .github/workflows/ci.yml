name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories land without a commit. A docs-only PR skips the vulnerability scan (below), so
  # this is what still catches a new one within a week.
  schedule:
    - cron: "17 3 * * 1"

# A new push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the heavy jobs run. A pull request that touches only documentation skips
  # them: a job skipped by `if` reports as skipped, which branch protection accepts as passing,
  # so the required checks still resolve (a workflow-level `paths:` filter would leave them
  # missing and block the merge). Everything runs on a push to main, on the weekly schedule,
  # and for any PR that touches a file outside the list below. The secret scan always runs,
  # because a document can hold a secret as easily as code can.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # Anything that is not documentation counts as code, including the workflow itself.
            other=$(git diff --name-only "$BASE" "$HEAD" \
              | grep -Ev '^(docs/|agent_docs/|LICENSE$|[^/]+\.md$)' || true)
            [ -z "$other" ] && code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  check:
    name: Static gates
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmtcheck
      - run: make vet
      - run: make tidycheck
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Fast tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  test-all:
    name: Full suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # e2e fixtures shell out to git, so it needs an identity to commit with.
      - name: Configure git for fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name  CI
          git config --global init.defaultBranch main
      - run: make test-all

  xbuild:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # make VERSION uses git describe
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make xbuild

  # Zero tokens: the mock provider replays recorded traffic, so this reaches no
  # network and costs nothing. `make bench` is the paid target and is never in CI.
  #
  # The gate is that the corpus RAN — every task was put a question and every
  # worktree reclaimed — not that any task passed. The mock fixture solves nothing,
  # so all ten oracles fail; a failing oracle is data, not a failing command, and
  # the runner exits 0.
  bench-smoke:
    name: Bench smoke (mock provider, zero tokens)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The runner forks a worktree per task and snapshots turns, so git needs an
      # identity to commit with — same reason as the full suite's fixtures.
      - name: Configure git for worktrees
        run: |
          git config --global user.email ci@example.com
          git config --global user.name  CI
          git config --global init.defaultBranch main
      - run: make bench-smoke

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tree
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Installed and run directly rather than via gitleaks-action, so CI runs the
      # exact command the pre-push hook does and the two cannot drift. The action
      # additionally requires a GITHUB_TOKEN on pull_request events and phones home
      # for an organisation licence check; neither buys anything here.
      #
      # The module path is NOT github.com/gitleaks/gitleaks — the project moved orgs
      # but still declares the old path in its go.mod, so `go install` needs this one.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: make secrets

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Run it directly: golang/govulncheck-action installs its own `stable` Go (its
      # go-version-input default wins over go-version-file), which scans a stdlib other than
      # the one go.mod pins and reported advisories this module's toolchain already fixes.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
