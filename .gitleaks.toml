title = "kopicode gitleaks config"

# gitleaks's default rule set, unchanged. This file only adds an allowlist —
# it does not narrow or replace what the default config already scans for.
[extend]
useDefault = true

# `make secrets` runs both `gitleaks detect` (git history) and `gitleaks dir .`
# (the working tree) — see the Makefile's `secrets` target and
# .github/workflows/ci.yml's "Secret scan" job, which runs the identical
# command so the two cannot drift.
#
# `gitleaks dir .` scans the filesystem, not git's index, so it sees `.env`
# even though `.gitignore` (line: `/.env`) keeps it out of every commit. That
# file is the documented, intended place for a real OPENROUTER_API_KEY
# locally (see .env.example and AGENTS.md's Commands section) so that `make
# bench` and `make smoke-live` can read it without it ever touching the
# shell's history or environment inheritance rules. Scanning it is a false
# positive on every machine that has followed that instruction, and it is not
# a gap this allowlist opens: `gitleaks detect` (history) is untouched, so a
# key that ever actually reached a commit is still caught there regardless of
# this file.
[[allowlists]]
description = "the local .env is gitignored (/.env) and never committed; it exists so make bench/smoke-live can read OPENROUTER_API_KEY without it reaching the shell"
paths = [
  '''^\.env$''',
]

[[allowlists]]
description = "prompt_cache_key in the recorded Codex backend streams (internal/provider/testdata/codex) is a random per-request UUID, not a credential; scanners read it as a generic key. Only UUID-shaped values in those two files are excused, so a token pasted there would still be caught. The current files carry a placeholder; this covers the first recording in history."
condition = "AND"
paths = [
  '''^internal/provider/testdata/codex/(text_turn|tool_call)\.sse$''',
]
regexes = [
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]
